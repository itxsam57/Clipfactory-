[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfactory-zero"
version = "0.1.0"
description = "Zero-budget automated short-form content pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
