name: ClipFactory

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/youtube-pot-downloader
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 15 * * *"

permissions:
  contents: write

concurrency:
  group: clipfactory-${{ github.event_name == 'push' && 'validation' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Start YouTube PO-token provider
        run: |
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil-pot
          cd /tmp/bgutil-pot/server
          npm ci
          npx tsc
          nohup node build/main.js > /tmp/bgutil-provider.log 2>&1 &
          echo $! > /tmp/bgutil-provider.pid

          ready=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4416/ping >/tmp/bgutil-ping.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/bgutil-provider.log || true
            exit 1
          fi

          cat /tmp/bgutil-ping.json
          command -v google-chrome

      - name: Verify YouTube extraction stack
        run: |
          yt-dlp --verbose --skip-download --simulate \
            --js-runtimes node \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            --extractor-args "youtubepot-wpc:browser_path=/usr/bin/google-chrome" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" \
            2>&1 | tee /tmp/ytdlp-provider-check.log
          grep -E "JS runtimes:.*node" /tmp/ytdlp-provider-check.log
          grep -E "PO Token Providers:.*bgutil" /tmp/ytdlp-provider-check.log
          grep -E "PO Token Providers:.*wpc" /tmp/ytdlp-provider-check.log

      - name: Run unit tests
        run: pytest -q

      - name: Run factory
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[factory-test]')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v24.0' }}

          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
        run: python -m src.main

      - name: Persist state
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[factory-test]')
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No successful post changed state."
            exit 0
          fi
          git config user.name "clipfactory-bot"
          git config user.email "clipfactory-bot@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update clipfactory state [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload rendered output for debugging
        if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[factory-test]'))
        uses: actions/upload-artifact@v4
        with:
          name: clipfactory-output
          path: output/
          if-no-files-found: ignore
          retention-days: 2
